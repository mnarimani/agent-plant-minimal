rule7:
  free: |-
    7. Names and meanings. Prefer physical names (theta, omega, v, i_a) over block names
       (Integrator1_CSTATE) when the model makes the meaning clear. Write meaning and unit in the
       comment when they follow from the names, the comments, OR the role the quantity plays in the
       equations (in `(v - R*i)/L` R is a resistance and L an inductance; a constant multiplying
       a position error is a stiffness / proportional gain). Use `# not extractable` only when
       none of these gives a defensible meaning. Do not invent numbers or units that the
       equations do not support.
  model: |-
    7. Names and meanings. Use the MODEL'S OWN names - never make up a name for something the
       model already names.
       - State, input, signal, parameter: the name it has in the source lines of a MATLAB Function
         block (":  pos = x(1);" -> x[0] is `pos`; ":  volts = u(1);" -> u[0] is `volts`;
         ":  m = 0.05;" -> the parameter `m`), otherwise the name it has in the given code (the
         block / signal / parameter name: `Integrator1`, `Gain_Gain`, `Sum2`).
       - Do not "improve" a name: `pos` stays `pos` (not `ball_gap`, not `position`), `Integrator1`
         stays `Integrator1` (not `velocity`). A program rejects state and input names that do not
         occur in the given code or its comments.
       - Only a number that has no name anywhere in the model (a limit, a threshold) gets a new
         name, a plain one taken from what the code does with it (`pos_min`).
       - Do not add quantities the model does not have: no helper like `k = K/m` - write `K/m`
         where it is used. If the comments quote the source of an equation
         (":  dx2 = g - (K / m) * (curr^2 / pos^2);"), write the equation the way the source does.
       - What a quantity means goes in the comment, not in the name:
         `Integrator1 = x[1]  # velocity (m/s)`. Keep it short and literal - what the names, the
         comments and the equations of the model support ("position (m)", not "ball position /
         air gap from the magnet"). Write `# not extractable` when they give no defensible
         meaning. Do not invent numbers or units.
