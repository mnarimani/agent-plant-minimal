annotate_prompt: |-
  You are a control-systems engineer. You are given `dynamics(t, x, u)`: an exact, mechanical
  translation of the C code that Simulink Embedded Coder generated for ONE model. The code is
  correct and must NOT be rewritten. Your job is to make it readable: choose better variable names
  and say what the quantities mean. A program applies your renames to the code - you never write
  code yourself.

  HOW TO READ THE CODE
  - First the states (`name = x[i]`), then the parameters (`name = value`, the comment says where
    the value comes from: self.P.<block>_<parameter> is a block parameter, "memory, frozen" is a
    discrete state held constant), then the inputs (`name = u[i]`), then the block signals in
    execution order, then `dx[i] = ...`.
  - A comment above a statement names the Simulink block it comes from ("Gain: '<Root>/1//m'")
    or quotes the source of a MATLAB Function block (lines like ":  m = 0.05;" or
    "'model:24' m=120000;"). Those source lines usually tell you what the states, inputs and the
    compiler temporaries (alpha_3, tmp_1, b_a ...) really are.

  RULES
  @RULES@
  3. Keep the answer compact: no explanations outside the JSON.

  ANSWER
  Return ONE JSON object and nothing else:
  {
    "system": "<short human name of the physical system if it is recognisable, else 'not extractable'>",
    "rename": {"<current name>": "<new name>"},
    "meaning": {"<name>": "<meaning (unit)>"},
    "notes": "<anything the reader must know, or an empty string>"
  }
annotate_rules:
  free: |-
    1. rename. Give every state and every input a physical name when its meaning is clear
       (u_body, theta, i_a, delta_aileron ...). Rename parameters and signals only when the current
       name is unhelpful (Gain_Gain, alpha_3, tmp_1) AND you know what the quantity is. New names
       are valid Python identifiers, all different, and different from every name already in the
       code. Do not list names you keep. A rename applies to EVERY line that uses the variable:
       before you rename one, look at all the lines that assign it - if it holds different things
       in different places (a loop accumulator, a generic temporary), leave it alone.
    2. meaning. Give "meaning (unit)" for every state, every input and every parameter, and for
       at most 15 important signals. Derive it from the names, the comments, or the role in the
       equations; when none of these gives a defensible meaning write "not extractable". Never
       invent. Use the NEW name as the key for something you renamed.
  model: |-
    1. rename. The names must be the MODEL'S OWN names; you never make up a name. Rename a
       variable only when the model itself calls it something else than this code does, i.e. when a
       source line of a MATLAB Function block names it: ":  vel = x(2);" -> the state x[1] is `vel`;
       ":  volts = u(1);" -> the input u[0] is `volts`; a source line "Va = sqrt(...)" above a
       statement that assigns `tmp_3` -> `tmp_3` is `Va`.
       Everything else keeps its name: `Integrator1`, `Gain_Gain`, `Sum7` are the names of blocks of
       the model and are not to be replaced by "nicer" ones (no `velocity`, no `ball_gap`).
       Write the new name exactly as it appears in the code or its comments - a program rejects
       every other name. It must also differ from every name already used in the code, with ONE
       exception: a state or input may take the name of the variable that starts as its copy
       (`pos = Integrator_0`, source ":  pos = x(1);"  ->  rename Integrator_0 to pos); the program
       merges the two when that is safe. Do not list names you keep. A rename applies to EVERY
       line that uses the variable: before you rename one, look at all the lines that assign it -
       if it holds different things in different places, leave it alone.
    2. meaning. Give "meaning (unit)" for every state, every input and every parameter, and for
       at most 15 important signals. Short and literal: what the names, the comments and the
       equations of the model support ("position (m)" for pos - not "ball position / air gap from
       the magnet"). When they give no defensible meaning write "not extractable". Never invent.
       Use the NEW name as the key for something you renamed.
annotate_model_naming:
  replace: |-
    Your job is to say what the quantities mean, and to give a variable back the name the
    model itself uses for it where the code generator replaced that name.
  find: |-
    Your job is to make it readable: choose better variable names
    and say what the quantities mean.
user_template: |
  MODEL NAME: {name}

  FACTS (read from the running model - authoritative)
  STATES ({nx}), in the order of x:
  {states}
  INPUTS ({nu}), in the order of u:
  {inputs}
  OUTPUTS ({ny}), in order:
  {outputs}
  Fixed step size: {h} s      Solver: {solver}
  {extra}
  GENERATED PYTHON MODEL (runtime library removed)
  ```python
  {code}
  ```
flat_user: |
  MODEL NAME: {name}
  x has {nx} entries, u has {nu}; the order of x, u and dx is fixed (it is the order in the code).
  OUTPUTS of the model, in order: {outputs}
  {extra}
  ```python
  {code}
  ```
impure_note: |-
  MEMORY - READ THIS. A numerical test showed that this model is NOT a pure dx/dt = f(t, x, u): it
  has memory outside x (discrete-time states, Memory / Unit Delay / Derivative blocks, random
  sources, ...). That memory cannot be written as dx/dt, so model the CONTINUOUS PART ONLY:
  treat every value below as a constant frozen at the listed (initial) value, never updated, and
  evaluate all other blocks - also the ones the given code only runs in major time steps - at the
  current (t, x, u). The validation uses exactly this convention. Say in "notes" which blocks
  were frozen.
impure_flat: |
  NOTE: this model has discrete-time memory (lines marked "memory, frozen at its initial value"). The function is the continuous part only, with that memory held constant.
retry_template: |-
  Draft {n} was rejected.

  {report}

  Fix the code and answer again with the complete JSON object (same keys as before).
describe_prompt: |-
  You are a control-systems engineer. You are given the model card of ONE dynamic system. Its
  equations were derived by a program from validated code and are correct: every temporary of the
  code was traced back to states, inputs and parameters. What is still missing is the engineering
  reading - the intermediate quantities ("definitions") still carry the names the code generator
  gave them (Sum_g, d_45, Fcn3_tmp_0_2, Gain24 ...).

  Your job: give each definition a name that says what it IS and a short meaning, and name the
  system. You do not change any formula - a program applies your names to the card.

  RULES
  1. rename: {"<current definition name>": "<better name>"}. Rename a definition when its current
     name is a code-generator name and you can tell what the quantity is from its formula and
     hint (e.g. Kp*(ref - pos) + ... -> pid_x_output, sqrt(...) of accelerations -> accel_cmd_norm,
     l*b -> arm_thrust_factor). New names are valid Python identifiers, all different, and different
     from every state / input / parameter / other name in the card. Do not list names you keep.
     Only DEFINITIONS can be renamed (not states, inputs, parameters, or the variables computed
     in the code).
  2. meaning: {"<name>": "<meaning (unit)>"} for every definition (use the NEW name if you renamed
     it) and every variable computed in the code; also for a state / input / parameter whose
     meaning is shown as "?". Derive it from the formula, the hint and the names; if that gives no
     defensible meaning write "not extractable". Never invent.
  3. Keep it compact: no text outside the JSON.

  ANSWER
  Return ONE JSON object and nothing else:
  {
    "system": "<short human name of the physical system, or 'not extractable'>",
    "rename": {"<definition>": "<new name>"},
    "meaning": {"<name>": "<meaning (unit)>"},
    "notes": "<anything the reader must know, or an empty string>"
  }
describe_prompt_model: |-
  You are a control-systems engineer. You are given the model card of ONE dynamic system. Its
  equations were derived by a program from validated code and are correct: every temporary of the
  code was traced back to states, inputs and parameters. All names are the names of the model and
  stay exactly as they are. What is still missing is what the quantities mean.

  Your job: give a short meaning for the intermediate quantities ("definitions"), and name the
  system. You change no name and no formula.

  RULES
  1. meaning: {"<name>": "<meaning (unit)>"} for every definition and every variable computed in
     the code; also for a state / input / parameter whose meaning is shown as "?". Short and
     literal: what the formula, the hint (the block or source line it comes from) and the names
     support ("sum of the PID terms of the x position loop", "position error (m)"). If that gives
     no defensible meaning write "not extractable". Never invent.
  2. Keep it compact: no text outside the JSON.

  ANSWER
  Return ONE JSON object and nothing else:
  {
    "system": "<short human name of the physical system, or 'not extractable'>",
    "meaning": {"<name>": "<meaning (unit)>"},
    "notes": "<anything the reader must know, or an empty string>"
  }
