  Return ONE JSON object and nothing else:
  {
    "python_code": "<the complete code: the import line and the dynamics function>",
    "system": "<short human name of the physical system, e.g. 'Mass-Spring-Damper', if it is recognisable from the model name and equations, else 'not extractable'>",
    "outputs": ["<for each entry of OUTPUTS in FACTS, in order: the state / signal name (as used in your code) or the expression that drives that outport>"],
    "notes": "<anything the reader must know, or an empty string>"
